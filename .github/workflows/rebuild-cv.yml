name: Rebuild website CV
on:
  push:
    branches: [main]
    paths:
      - 'cv-src/**'
      - '.github/workflows/rebuild-cv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
      - name: Compile CV
        run: |
          cd cv-src
          pdflatex -interaction=nonstopmode -halt-on-error CV-Ortega.tex
          pdflatex -interaction=nonstopmode -halt-on-error CV-Ortega.tex
          cp CV-Ortega.pdf ../CV-Josue-Ortega.pdf
      - name: Publish PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV-Josue-Ortega.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild website CV with SCW R&R [skip ci]"
            git push
          fi
