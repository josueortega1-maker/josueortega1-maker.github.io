name: Update CV once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-cv-once.yml'

permissions:
  contents: write

jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current CV
        env:
          CV_URL: "https://uc7f0dd82dfeccfddefbc5e6d4db.dl.dropboxusercontent.com/cd/0/get/DJYfbl07vUbpoPQCquRGbYvqm3CcyUq-sZYEaPaeAeIil1bZLHT7XZOkHcr7OwvXPUL_4n2eTKLSZKO0G_L7YK44SZt_2jEjw157-1B9-CbK6jpaX7hOgsptevLoe6Tv_ESVUmkQfZ-kykM-G2liejYfkBNGup8d4TvLQ8sX-crrXw/file?c_luid=8db25bdb"
        run: |
          curl -L --fail --silent --show-error "$CV_URL" -o CV-Josue-Ortega.pdf
          test "$(stat -c%s CV-Josue-Ortega.pdf)" -eq 122053
          test "$(head -c 5 CV-Josue-Ortega.pdf)" = "%PDF-"
      - name: Commit CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV-Josue-Ortega.pdf
          git commit -m "Fix current CV PDF" || exit 0
          git push
